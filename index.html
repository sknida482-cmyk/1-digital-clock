<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main clock container -->
    <div class="clock-container">

        <!-- Small heading -->
        <p class="heading">DIGITAL CLOCK</p>

        <!-- Time display -->
        <div class="time" id="time">
            00:00:00
        </div>

        <!-- AM / PM -->
        <div class="period" id="period">
            AM
        </div>

        <!-- Date display -->
        <div class="date" id="date">
            Monday, 1 January 2026
        </div>

        <!-- Decorative line -->
        <div class="line"></div>

        <!-- Status -->
        <p class="status">● LIVE TIME</p>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
